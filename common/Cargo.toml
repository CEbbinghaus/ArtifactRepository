[package]
name = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
async-compression = { version = "0.4.33", features = ["all-algorithms", "futures-io"] }
async-stream = "0.3.6"
auto_enums = { version = "0.8.7", features = ["futures03", "type_analysis"] }
bytes = "1.10.1"
chrono = "0.4.41"
flate2 = { version = "1.1.5", features = ["zlib-rs"] }
futures = "0.3.31"
hex = "0.4.3"
lzma-rust2 = {version = "0.15.1", features = ["std"] }
opendal = "0.54.1"
serde = { version = "1.0.228", features = ["serde_derive"] }
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["full"] }
